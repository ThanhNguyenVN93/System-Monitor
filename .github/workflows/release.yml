name: Release
# Push a tag like v1.2.1 to build the single exe and publish it as a GitHub Release with the
# asset names the in-app updater expects (SystemMonitor.exe + SystemMonitor.exe.sha256).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Check tag matches AssemblyVersion
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $m = Select-String -Path Properties/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+\.\d+\.\d+)' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { Write-Error "Tag v$tag does not match AssemblyVersion $ver"; exit 1 }

      - name: Build Release
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          msbuild frm_sys_monitor.csproj /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/frm_sys_monitor.Tests --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package single exe + checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem bin/Release -File
          if ($files.Count -ne 1) { Write-Error "Expected only the exe in bin/Release, found: $($files.Name -join ', ')"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/Release/System Monitor.exe" dist/SystemMonitor.exe
          $hash = (Get-FileHash dist/SystemMonitor.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/SystemMonitor.exe.sha256 -Value "$hash  SystemMonitor.exe" -NoNewline -Encoding ascii

      # Intel Power Gadget files are not in the repo, so this build has no Intel power readout.
      # To ship a build with it, build locally and replace both assets on the release.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/SystemMonitor.exe dist/SystemMonitor.exe.sha256 --clobber
          } else {
            gh release create $tag dist/SystemMonitor.exe dist/SystemMonitor.exe.sha256 --title "System Monitor $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

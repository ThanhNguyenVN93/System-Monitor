name: Release
# Runs on every push to master. The version in Properties/AssemblyInfo.cs decides whether anything
# is released: if the tag v<version> already exists, the run does nothing. So a normal merge
# ships nothing; bump AssemblyVersion in a PR and the merge publishes the new version.
# Assets use the names the in-app updater expects (SystemMonitor.exe + SystemMonitor.exe.sha256).
on:
  push:
    branches: [master]
  workflow_dispatch:

# One release run at a time; a second merge waits instead of racing for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Read version and check whether it is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path Properties/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+\.\d+\.\d+)' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          $tag = "v$ver"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag is already released; nothing to do."
            "new=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "$tag is new; releasing."
            "new=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Release
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          msbuild frm_sys_monitor.csproj /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: |
          dotnet test tests/frm_sys_monitor.Tests --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package single exe + checksum
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem bin/Release -File
          if ($files.Count -ne 1) { Write-Error "Expected only the exe in bin/Release, found: $($files.Name -join ', ')"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/Release/System Monitor.exe" dist/SystemMonitor.exe
          $hash = (Get-FileHash dist/SystemMonitor.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/SystemMonitor.exe.sha256 -Value "$hash  SystemMonitor.exe" -NoNewline -Encoding ascii

      # Intel Power Gadget files are not in the repo, so these builds have no Intel power readout.
      # To ship a build with it, build locally and replace both assets on the release.
      - name: Publish GitHub Release
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag dist/SystemMonitor.exe dist/SystemMonitor.exe.sha256 `
            --target $env:GITHUB_SHA --title "System Monitor $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
